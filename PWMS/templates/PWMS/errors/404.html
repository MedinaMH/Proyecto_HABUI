{% load static %}
<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>{{ titulo }}</title>

        <!-- Bootstrap local -->
        <link rel="stylesheet" href="{% static 'css/bootstrap.css' %}">
        <link rel="stylesheet" href="{% static 'css/bootstrap-icons.css' %}">
        
        <!-- Estilos para errores -->
        <link rel="stylesheet" href="{% static 'css/errores.css' %}">
    </head>

    <body class="error-page error-404">
        <div class="error-container">
            <i class="bi bi-exclamation-triangle-fill error-icon"></i>
            <h1 class="error-title">404</h1>
            <p class="error-message">{{ mensaje }}</p>
            
            <div class="error-buttons">
                <a href="{% url 'PWMS:panel_login' %}" class="error-button error-button-primary">
                    <i class="bi bi-house-door"></i>Ir al Login
                </a>
                <a href="javascript:history.back()" class="error-button error-button-secondary">
                    <i class="bi bi-arrow-left"></i>Volver Atrás
                </a>
            </div>
            
            <div class="error-footer">
                <small>
                    <i class="bi bi-shield-check"></i>
                    Sistema PWMS v1.0
                </small>
            </div>
        </div>
    </body>
</html>
