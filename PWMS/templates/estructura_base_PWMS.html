{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block titulo %}Sistema PWMS{% endblock %}</title>

    <!-- Bootstrap CSS -->
    <!-- <link 
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" 
      rel="stylesheet"
    > -->
    <!-- Iconos bootstrap -->
    <!-- <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet"> -->

    <!-- Bootstrap local -->
    <link rel="stylesheet" href="{% static 'css/bootstrap.css' %}">

    <!-- Bootstrap Icons local -->
    <link rel="stylesheet" href="{% static 'css/bootstrap-icons.css' %}">

    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="{% static 'css/estilos_panel_rems.css' %}">
    
  </head>

  <body>
    <!-- Header superior -->
    <header class="navbar navbar-dark bg-primary fixed-top d-flex justify-content-between align-items-center px-3" style="height: 85px;">
      <a href="{% url 'panel_principal' %}" class="btn btn-outline-light d-flex align-items-center gap-2">
        <i class="bi bi-arrow-left-circle-fill fs-5"></i>
        <span class="d-none d-sm-inline">Panel principal</span>
      </a>
      <div class="text-center flex-grow-1">
        <span class="encabezado">Sistema de Monitoreo de Bienestar Psicológico</span>
      </div>
      <div style="width: 110px;"></div>

      <button 
        class="navbar-toggler d-md-none" 
        type="button" 
        data-bs-toggle="collapse" 
        data-bs-target="#sidebarMenu" 
        aria-controls="sidebarMenu" 
        aria-expanded="false" 
        aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
    </header>

    <div class="container-fluid">
      <div class="row">
        <!-- Sidebar -->
        <nav id="sidebarMenu" class="col-md-3 col-lg-2 d-md-block bg-light sidebar collapse">
          <div class="position-sticky pt-3">
            <ul class="nav flex-column">

              <!-- LOGIN -->
              <li class="nav-item">
                  <i class="bi bi-grid-1x2-fill me-2"></i>Login
                <!-- </a> -->
              </li>
              <!-- SIGNOS VITALES -->
              <li class="nav-item">
                  <i class="bi bi-grid-1x2-fill me-2"></i>Signos Vitales
                <!-- </a> -->
              </li>

              <!-- PRUEBAS -->
              <li class="nav-item">
                  <i class="bi bi-lightning-charge-fill me-2"></i>Pruebas psicológicas
                <!-- </a> -->
              </li>

              <!-- Bitácora -->
              <li class="nav-item">
                  <i class="bi bi-droplet-fill me-2"></i>Bitácora
                <!-- </a> -->
              </li>

            </ul>
          </div>
        </nav>

        <!-- Contenido -->
        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 mt-4">
          {% block contenido %}
          {% endblock %}
        </main>
      </div>
    </div>

    <footer class="text-center py-3 bg-light border-top mt-auto">
      <small>&copy; 2025 MACII CREDES</small>
    </footer>

    <!-- Bootstrap JS -->
    <!-- <script 
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" 
      crossorigin="anonymous">
    </script> -->

    <!-- Bootstrap JS local (incluye Popper) -->
    <script src="{% static 'js/bootstrap.bundle.js' %}"></script>
  </body>
</html>
