        💡 Potencia: ${potencia?.toFixed(2)} W
      `)
      .style("left", (event.pageX + 10) + "px")
      .style("top", (event.pageY - 30) + "px")
      .style("opacity", 1);
    }
  }

  function mouseout() {
    focusCircle.style("opacity", 0);
    tooltip.style("opacity", 0);
  }

  function updateChart() {
    pathTension.attr("d", line(data.tension));
    pathCorriente.attr("d", line(data.corriente));
    pathPotencia.attr("d", line(data.potencia));
  }

  // === GAUGE ===
  const gaugeSvg = d3.select("#gaugeChart")
    .attr("viewBox", "0 0 300 300");
  const radius = 120, cx = 150, cy = 150, maxPotencia = 5000;
  const scale = d3.scaleLinear().domain([0, maxPotencia]).range([-Math.PI / 2, Math.PI / 2]);

  const arcBg = d3.arc().innerRadius(radius - 30).outerRadius(radius)
    .startAngle(-Math.PI / 2).endAngle(Math.PI / 2);
  gaugeSvg.append("path")
    .attr("d", arcBg).attr("fill", "#ddd").attr("transform", `translate(${cx},${cy})`);
  const arcValue = d3.arc().innerRadius(radius - 30).outerRadius(radius).startAngle(-Math.PI / 2);
  const arcPath = gaugeSvg.append("path").attr("fill", "#ff7f0e").attr("transform", `translate(${cx},${cy})`);
  const needle = gaugeSvg.append("line")
    .attr("x1", cx).attr("y1", cy)
    .attr("x2", cx).attr("y2", cy - radius + 20)
    .attr("stroke", "#222").attr("stroke-width", 3)
    .attr("transform", `rotate(-90,${cx},${cy})`);
  const valueText = gaugeSvg.append("text")
    .attr("x", cx).attr("y", cy + 50)
    .attr("text-anchor", "middle")
    .attr("font-size", "22px")
    .attr("font-weight", "bold").text("-- W");

  function updateGauge(potencia) {
    const angle = scale(potencia);
    const arc = arcValue.endAngle(angle);
    arcPath.attr("d", arc);
    valueText.text(`${potencia.toFixed(0)} W`);
    needle.transition().duration(500)
      .attr("transform", `rotate(${(angle * 180 / Math.PI)},${cx},${cy})`);
  }

  // === WebSocket ===
  ws.onmessage = function(event) {
    const msg = JSON.parse(event.data);
    const tension = msg.tension;
    const corriente = msg.corriente;
    const potencia = msg.potencia;

    document.getElementById("tension").textContent = tension.toFixed(2);
    document.getElementById("corriente").textContent = corriente.toFixed(2);
    document.getElementById("potencia").textContent = potencia.toFixed(2);

    data.tension.push(tension); data.tension.shift();
    data.corriente.push(corriente); data.corriente.shift();
    data.potencia.push(potencia); data.potencia.shift();

    const maxY = Math.max(
      d3.max(data.tension),
      d3.max(data.corriente),
      d3.max(data.potencia)
    ) * 1.1;

    y.domain([0, maxY]);
    yAxis.transition().duration(300).call(d3.axisLeft(y));

    updateChart();
    updateGauge(potencia);
  };

  updateChart();
  updateGauge(0);
});

// === Guardar y cargar posiciones en localStorage ===
function savePosition(id, x, y, width, height) {
  const positions = JSON.parse(localStorage.getItem("chartPositions") || "{}");
  positions[id] = { x, y, width, height };
  localStorage.setItem("chartPositions", JSON.stringify(positions));
}

function loadPosition(id) {
  const positions = JSON.parse(localStorage.getItem("chartPositions") || "{}");
  return positions[id] || null;
}

// Restaurar posiciones guardadas al cargar la página
document.querySelectorAll(".grafico").forEach(el => {
  const id = el.id;
  const saved = loadPosition(id);
  if (saved) {
    el.style.transform = `translate(${saved.x}px, ${saved.y}px)`;
    el.style.width = saved.width + "px";
    el.style.height = saved.height + "px";
    el.setAttribute('data-x', saved.x);
    el.setAttribute('data-y', saved.y);
  }
});

// === Movimiento y redimensionado ===
interact('.grafico')
  .draggable({
    onmove(event) {
      const target = event.target;
      const x = (parseFloat(target.getAttribute('data-x')) || 0) + event.dx;
      const y = (parseFloat(target.getAttribute('data-y')) || 0) + event.dy;

      target.style.transform = `translate(${x}px, ${y}px)`;
      target.setAttribute('data-x', x);
      target.setAttribute('data-y', y);

      //  Guardar la posición actual
      savePosition(target.id, x, y, target.offsetWidth, target.offsetHeight);
    }
  })
  .resizable({ edges: { left: true, right: true, bottom: true, top: true } })
  .on('resizemove', event => {
    const target = event.target;
    target.style.width = event.rect.width + 'px';
    target.style.height = event.rect.height + 'px';

    const x = parseFloat(target.getAttribute('data-x')) || 0;
    const y = parseFloat(target.getAttribute('data-y')) || 0;

    //  Guardar tamaño y posición actual
    savePosition(target.id, x, y, event.rect.width, event.rect.height);
  });

</script>
