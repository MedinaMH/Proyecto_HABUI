<h3 style="color: #00bfff; font-weight:600;">💧 Monitoreo de Agua del Hábitat</h3>

<div id="grafico-nivel" class="mb-5"></div>
<div id="grafico-ph"></div>
<div id="serie-temporal" style="margin-top:40px;"></div>
<div id="heatmap-diario" style="margin-top:40px;"></div>

<!-- NUEVAS GRÁFICAS -->
<div id="serie-temporal"></div>
<div id="heatmap-diario"></div>

<script>
document.addEventListener("DOMContentLoaded", function () {

  d3.select("body").style("background-color", "#0b0f19");

  // ============================================================
  // ============ GRAFICO DE TANQUE ===========
  // ============================================================

  function tanqueAgua(containerId, valorInicial) {

    const width = 140;
    const height = 260;

    const svg = d3.select(containerId)
      .html("")
      .append("svg")
      .attr("width", width)
      .attr("height", height);

    svg.append("text")
      .attr("x", width / 2)
      .attr("y", 20)
      .attr("fill", "#00bfff")
      .attr("font-size", "16px")
      .attr("font-weight", "bold")
      .attr("text-anchor", "middle")
      .text("Nivel");

    svg.append("rect")
      .attr("x", width / 2 - 35)
      .attr("y", 40)
      .attr("width", 70)
      .attr("height", height - 70)
      .attr("fill", "#0f172a")
      .attr("stroke", "#00bfff")
      .attr("stroke-width", 3)
      .attr("rx", 12);

    const agua = svg.append("rect")
      .attr("x", width / 2 - 33)
      .attr("width", 66)
      .attr("fill", "url(#gradAgua)")
      .attr("rx", 10);

    const defs = svg.append("defs");
    const grad = defs.append("linearGradient")
      .attr("id", "gradAgua")
      .attr("x1", "0%")
      .attr("y1", "100%")
      .attr("x2", "0%")
      .attr("y2", "0%");
    grad.append("stop").attr("offset", "0%").attr("stop-color", "#0077ff");
    grad.append("stop").attr("offset", "100%").attr("stop-color", "#00e5ff");

    const texto = svg.append("text")
      .attr("x", width / 2)
      .attr("y", height - 5)
      .attr("fill", "#00bfff")
      .attr("font-size", "22px")
      .attr("font-weight", "bold")
      .attr("text-anchor", "middle");

    const escala = d3.scaleLinear()
      .domain([0, 100])
      .range([height - 30, 40]);

    function actualizar(valor) {
      let y = escala(valor);
      let h = (height - 30) - y;

      agua
        .transition().duration(500)
        .attr("y", y).attr("height", h);

      texto.text(valor.toFixed(1) + "%");
    }

    actualizar(valorInicial);
    return actualizar;
  }

  const actualizarNivel = tanqueAgua("#grafico-nivel", 0);

  // ============================================================
  // ==================== TERMÓMETRO DE PH =======================
  // ============================================================

  function crearTermometro(containerId) {
    const width = 120;
    const height = 260;

    const svg = d3.select(containerId)
      .html("")
      .append("svg")
      .attr("width", width)
      .attr("height", height);

    svg.append("text")
      .attr("x", width / 2)
      .attr("y", 20)
      .attr("fill", "#32cd32")
      .attr("font-size", "16px")
      .attr("font-weight", "bold")
      .attr("text-anchor", "middle")
      .text("pH");

    const scale = d3.scaleLinear()
      .domain([0, 14])
      .range([height - 30, 40]);

    svg.append("rect")
      .attr("x", width / 2 - 20)
      .attr("y", 40)
      .attr("width", 40)
      .attr("height", height - 70)
      .attr("fill", "#111")
      .attr("stroke", "#32cd32")
      .attr("stroke-width", 3)
      .attr("rx", 10);

    const nivel = svg.append("rect")
      .attr("x", width / 2 - 18)
      .attr("width", 36)
      .attr("fill", "#32cd32")
      .attr("rx", 8);

    const texto = svg.append("text")
      .attr("x", width / 2)
      .attr("y", height - 5)
      .attr("fill", "#32cd32")
      .attr("font-size", "22px")
      .attr("font-weight", "bold")
      .attr("text-anchor", "middle");

    function actualizarPH(valor) {
      let y = scale(valor);
      let h = (height - 30) - y;

      nivel.transition().duration(400)
        .attr("y", y).attr("height", h);

      texto.text(valor.toFixed(2));
    }

    return actualizarPH;
  }

  const actualizarPh = crearTermometro("#grafico-ph");


// ============================================================
// =========== SERIE TEMPORAL PROGRESIVA =============
// ============================================================

function crearSerieTemporal() {

    const margin = { top: 40, right: 50, bottom: 40, left: 50 };
    const width = 500 - margin.left - margin.right;
    const height = 250 - margin.top - margin.bottom;

    const svg = d3.select("#serie-temporal")
        .html("")
        .append("svg")
        .attr("width", width + margin.left + margin.right)
        .attr("height", height + margin.top + margin.bottom)
        .style("background", "#111827")
        .style("border", "2px solid #00bfff")
        .style("border-radius", "10px")
        .append("g")
        .attr("transform", `translate(${margin.left},${margin.top})`);

    const data = [];

    // IMPORTANTE: escala lineal para que la línea avance paso a paso
    const x = d3.scaleLinear().range([0, width]);

    const yNivel = d3.scaleLinear().domain([0, 100]).range([height, 0]);
    const yPh = d3.scaleLinear().domain([0, 14]).range([height, 0]);

    const lineaNivel = d3.line()
        .x(d => x(d.index))
        .y(d => yNivel(d.nivel));

    const lineaPh = d3.line()
        .x(d => x(d.index))
        .y(d => yPh(d.ph));

    // ------- Tooltip -------
    const tooltip = d3.select("#serie-temporal")
        .append("div")
        .style("position", "absolute")
        .style("padding", "8px 12px")
        .style("background", "rgba(0,0,0,0.80)")
        .style("color", "#00eaff")
        .style("border", "1px solid #00eaff")
        .style("border-radius", "6px")
        .style("font-size", "13px")
        .style("pointer-events", "none")
        .style("opacity", 0);

    const focus = svg.append("circle")
        .attr("r", 6)
        .attr("fill", "#00eaff")
        .attr("stroke", "#fff")
        .attr("stroke-width", 2)
        .style("opacity", 0);

    const verticalLine = svg.append("line")
        .attr("stroke", "#00eaff")
        .attr("stroke-width", 1)
        .style("opacity", 0);

    // Ejes
    svg.append("g").attr("class", "x-axis").attr("transform", `translate(0,${height})`);
    svg.append("g").attr("class", "y-axis-nivel");
    svg.append("g").attr("class", "y-axis-ph").attr("transform", `translate(${width},0)`);

    // Título
    svg.append("text")
        .attr("x", width / 2)
        .attr("y", -10)
        .attr("fill", "#00eaff")
        .attr("font-size", "16px")
        .attr("font-weight", "bold")
        .attr("text-anchor", "middle")
        .text("Serie Temporal • Nivel (%) y pH");

    // ============================================================
    // =============== ACTUALIZAR GRAFICA =========================
    // ============================================================

    function actualizarSerieTemporal(nivel, ph) {

        // índice progresivo para que se dibuje paso a paso
        const index = data.length;

        data.push({
            index,
            nivel,
            ph,
            fecha: new Date()
        });

        // Mantener lista a un tamaño razonable
        if (data.length > 200) data.shift();

        // El dominio crece con los puntos
        x.domain([0, Math.max(30, data.length - 1)]);

        svg.select(".x-axis").call(d3.axisBottom(x).ticks(5));
        svg.select(".y-axis-nivel").call(d3.axisLeft(yNivel).ticks(5));
        svg.select(".y-axis-ph").call(d3.axisRight(yPh).ticks(5));

        // ----- Dibujar líneas con transición -------
        svg.selectAll(".line-nivel")
            .data([data])
            .join("path")
            .attr("class", "line-nivel")
            .transition()
            .duration(400)
            .attr("d", lineaNivel)
            .attr("stroke", "#00bfff")
            .attr("stroke-width", 2)
            .attr("fill", "none");

        svg.selectAll(".line-ph")
            .data([data])
            .join("path")
            .attr("class", "line-ph")
            .transition()
            .duration(400)
            .attr("d", lineaPh)
            .attr("stroke", "#32cd32")
            .attr("stroke-width", 2)
            .attr("fill", "none");

        // Overlay interactivo
        svg.selectAll(".overlay").data([null]).join("rect")
            .attr("class", "overlay")
            .attr("width", width)
            .attr("height", height)
            .style("fill", "none")
            .style("pointer-events", "all")
            .on("mousemove", function (event) {

                const [mx] = d3.pointer(event);
                const indexHover = Math.round(x.invert(mx));

                const punto = data[indexHover];
                if (!punto) return;

                focus
                    .attr("cx", x(punto.index))
                    .attr("cy", yNivel(punto.nivel))
                    .style("opacity", 1);

                verticalLine
                    .attr("x1", x(punto.index))
                    .attr("x2", x(punto.index))
                    .attr("y1", 0)
                    .attr("y2", height)
                    .style("opacity", 1);

                tooltip
                    .html(`
                        <strong>${punto.fecha.toLocaleTimeString()}</strong><br>
                        Nivel: ${punto.nivel}%<br>
                        pH: ${punto.ph}
                    `)
                    .style("left", (event.pageX + 15) + "px")
                    .style("top", (event.pageY - 20) + "px")
                    .style("opacity", 1);
            })
            .on("mouseout", () => {
                focus.style("opacity", 0);
                verticalLine.style("opacity", 0);
                tooltip.style("opacity", 0);
            });
    }

    return actualizarSerieTemporal;
}

const actualizarSerieTemporal = crearSerieTemporal();


// ============================================================
// ================ HEATMAP DIARIO ===================
// ============================================================

const heatmapData = new Array(24).fill(null);

function crearHeatmapDiario() {

    const svg = d3.select("#heatmap-diario")
        .html("") 
        .append("svg")
        .attr("width", 500)
        .attr("height", 200)
        .style("background", "#111827")
        .style("border", "2px solid #00bfff")
        .style("border-radius", "10px");

    // Título
    svg.append("text")
        .attr("x", 250)
        .attr("y", 25)
        .attr("fill", "#00eaff")
        .attr("text-anchor", "middle")
        .attr("font-size", "16px")
        .attr("font-weight", "bold")
        .text("Heatmap Diario • Nivel del Tanque (%)");

    // Leyenda
    const defs = svg.append("defs");
    const grad = defs.append("linearGradient")
        .attr("id", "gradLegenda")
        .attr("x1", "0%").attr("y1", "0%")
        .attr("x2", "100%").attr("y2", "0%");

    grad.append("stop").attr("offset", "0%").attr("stop-color", "#00111f");
    grad.append("stop").attr("offset", "100%").attr("stop-color", "#00e5ff");

    svg.append("rect")
        .attr("x", 40)
        .attr("y", 150)
        .attr("width", 420)
        .attr("height", 12)
        .attr("fill", "url(#gradLegenda)")
        .attr("rx", 4);

    svg.append("text").attr("x", 40).attr("y", 145).attr("fill", "#00bfff").text("0%");
    svg.append("text").attr("x", 450).attr("y", 145).attr("fill", "#00eaff").attr("text-anchor", "end").text("100%");

    // Tooltip
    const tooltip = d3.select("#heatmap-diario")
        .append("div")
        .style("position", "absolute")
        .style("padding", "6px 10px")
        .style("background", "rgba(0,0,0,0.80)")
        .style("color", "#00eaff")
        .style("border", "1px solid #00eaff")
        .style("border-radius", "6px")
        .style("font-size", "12px")
        .style("pointer-events", "none")
        .style("opacity", 0);

    const horas = d3.scaleBand()
        .domain(d3.range(0, 24))
        .range([40, 460])
        .padding(0.08);

    const color = d3.scaleLinear()
        .domain([0, 100])
        .range(["#00111f", "#00e5ff"]);

    // Función para actualizar
    function actualizarHeatmapDiario(nivel) {

        const hora = new Date().getHours();
        heatmapData[hora] = nivel;

        svg.selectAll("rect.celda").remove();

        svg.selectAll("rect.celda")
            .data(d3.range(0, 24))
            .enter()
            .append("rect")
            .attr("class", "celda")
            .attr("x", d => horas(d))
            .attr("y", 60)
            .attr("width", horas.bandwidth())
            .attr("height", 60)
            .attr("rx", 4)
            .attr("fill", d =>
                heatmapData[d] !== null ? color(heatmapData[d]) : "#0d1a2a"
            )
            .on("mousemove", (event, d) => {

                tooltip
                    .html(`
                        <strong>Hora:</strong> ${d}:00<br>
                        <strong>Nivel:</strong> ${heatmapData[d] ?? "—"}%
                    `)
                    .style("left", (event.pageX + 10) + "px")
                    .style("top", (event.pageY - 20) + "px")
                    .style("opacity", 1);

                d3.select(event.target)
                    .attr("stroke", "#ffffff")
                    .attr("stroke-width", 2);
            })
            .on("mouseout", (event) => {
                tooltip.style("opacity", 0);
                d3.select(event.target)
                    .attr("stroke", "none");
            });
    }

    return actualizarHeatmapDiario;
}

const actualizarHeatmapDiario = crearHeatmapDiario();


  // ============================================================
