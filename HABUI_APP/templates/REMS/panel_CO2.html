{% extends "REMS/estructura_base.html" %}

{% block titulo %} Sistema REMS{% endblock %}

{% block contenido %} 

{% load static %}

<!-- co2_monitor.html -->
<script src="{% static 'js/d3.js' %}"></script>

<h3 style="color: #ffb74d; font-weight:600;">📈 Monitoreo CO₂ (ppm)</h3>

<div style="display:flex; gap:36px; justify-content:center; align-items:flex-start;">
  <div id="gauge-co2" style="width:320px; height:520px;"></div>
  <div id="serie-co2" style="width:720px; height:520px; margin-top:10px;"></div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function () {
  d3.select("body").style("background-color", "#0b0f19");

  // ===================== GAUGE VERTICAL (CO2 ppm) =====================
  function gaugeCO2(containerId, initial) {
    const width = 300;
    const height = 520;
    const min = 300;    // visual min
    const max = 2500;   // visual max

    const svg = d3.select(containerId).html("")
      .append("svg")
      .attr("width", width)
      .attr("height", height);

    svg.append("text")
      .attr("x", width/2)
      .attr("y", 32)
      .attr("fill", "#ffb74d")
      .attr("font-size", "22px")
      .attr("font-weight", "700")
      .attr("text-anchor", "middle")
      .text("CO₂ (ppm)");

    // outer frame
    const frameX = 60;
    const frameY = 70;
    const frameW = 180;
    const frameH = 360;

    svg.append("rect")
      .attr("x", frameX)
      .attr("y", frameY)
      .attr("width", frameW)
      .attr("height", frameH)
      .attr("rx", 14)
      .attr("fill", "#0f1724")
      .attr("stroke", "#ffb74d")
      .attr("stroke-width", 3);

    // fill rect
    const scale = d3.scaleLinear().domain([min, max]).range([frameY + frameH, frameY]);

    const fillRect = svg.append("rect")
      .attr("x", frameX)
      .attr("width", frameW)
      .attr("y", scale(initial))
      .attr("height", Math.max(2, (frameY + frameH) - scale(initial)))
      .attr("fill", "#ffb74d")
      .attr("rx", 12);

    const valueText = svg.append("text")
      .attr("x", width/2)
      .attr("y", frameY + frameH + 50)
      .attr("fill", "#ffb74d")
      .attr("font-size", "28px")
      .attr("font-weight", "700")
      .attr("text-anchor", "middle")
      .text(initial + " ppm");

    // color overlay depending on ranges (good/moderate/high)
    function colorFor(v) {
      if (v < 800) return "#7ef9a3";        // good (greenish)
      if (v < 1200) return "#ffd86b";       // moderate (amber)
      return "#ff7a7a";                     // high (red)
    }

    return {
      update: function(newVal) {
        const y = scale(newVal);
        const h = Math.max(2, (frameY + frameH) - y);

        fillRect
          .transition().duration(300)
          .attr("y", y)
          .attr("height", h)
          .attr("fill", colorFor(newVal));

        valueText.text(Math.round(newVal) + " ppm");
      }
    };
  }

  // ===================== SERIE TEMPORAL (LINE) =====================
  function lineChartCO2(containerId) {
    const outerW = 720, outerH = 480;
    const margin = {top: 30, right: 20, bottom: 40, left: 60};
    const width = outerW - margin.left - margin.right;
    const height = outerH - margin.top - margin.bottom;

    const svg = d3.select(containerId).html("")
      .append("svg")
      .attr("width", outerW)
      .attr("height", outerH)
      .style("background", "#0f1724")
      .style("border", "2px solid #ffb74d")
      .style("border-radius", "8px");

    const g = svg.append("g").attr("transform", `translate(${margin.left},${margin.top})`);

    // Scales
    const x = d3.scaleTime().range([0, width]);
    const y = d3.scaleLinear().domain([300, 2500]).range([height, 0]);

    const line = d3.line()
      .x(d => x(new Date(d.t)))
      .y(d => y(d.v))
      .curve(d3.curveMonotoneX);

    // axes groups
    const xAxisG = g.append("g").attr("transform", `translate(0,${height})`);
    const yAxisG = g.append("g");

    // axis labels
    svg.append("text")
      .attr("x", outerW/2)
      .attr("y", 18)
      .attr("fill", "#ffb74d")
      .attr("font-size", "16px")
      .attr("font-weight", "700")
      .attr("text-anchor", "middle")
      .text("Serie Temporal • CO₂ (ppm)");

    // path
    const path = g.append("path")
      .attr("class", "line-co2")
      .attr("fill", "none")
      .attr("stroke-width", 2.5)
      .attr("stroke", "#ffb74d");

    // tooltip
    const tooltip = d3.select(containerId)
      .append("div")
      .style("position", "absolute")
      .style("background", "rgba(0,0,0,0.85)")
      .style("color", "#fff")
      .style("padding", "6px 8px")
      .style("border", "1px solid #ffb74d")
      .style("border-radius", "6px")
      .style("font-size", "12px")
      .style("pointer-events", "none")
      .style("opacity", 0);

    let data = [];

    function redraw() {
      if (data.length === 0) return;

      // keep last N points
      const maxPoints = 120;
      if (data.length > maxPoints) data = data.slice(data.length - maxPoints);

      x.domain(d3.extent(data, d => new Date(d.t)));
      // adapt y domain to recent data but keep min/max sensible
      const vmin = Math.min(d3.min(data, d => d.v), 300);
      const vmax = Math.max(d3.max(data, d => d.v), 800);
      y.domain([Math.max(300, vmin - 50), Math.min(3000, vmax + 50)]);

      xAxisG.call(d3.axisBottom(x).ticks(6).tickFormat(d3.timeFormat("%H:%M:%S")).tickSizeOuter(0))
        .selectAll("text").attr("fill", "#ddd");
      yAxisG.call(d3.axisLeft(y).ticks(6).tickSizeOuter(0))
        .selectAll("text").attr("fill", "#ddd");

      path.datum(data).attr("d", line);
    }

    return {
      push: function(value, timestampStr) {
        const t = (timestampStr) ? timestampStr : new Date().toISOString();
        data.push({ v: value, t: t });
        redraw();
      },
      reset: function() {
        data = [];
        path.datum(data).attr("d", line);
      }
    };
  }

  // ============== INSTANCIAS ==============
  const gauge = gaugeCO2("#gauge-co2", 600);
  const series = lineChartCO2("#serie-co2");

// ================= WEBSOCKET =================
 const socket = new WebSocket("ws://" + window.location.host + "/ws/co2/");

  socket.onmessage = function(e) {
      const mensaje = JSON.parse(e.data);

      const valor = mensaje.valor;
      const fecha = mensaje.fecha_hora;

      gauge.update(valor);
      series.push(valor, fecha);
  };

});
</script>


{% endblock %}
